services:
  - type: web
    name: slack-jira-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_USER_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: JIRA_OAUTH_CLIENT_ID
        sync: false
      - key: JIRA_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: OPS_CHANNEL_ID
        sync: false
      - key: INTEGRATIONS_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_DEPLOYMENT
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY_PREVIOUS
        sync: false
      - key: ADMIN_SLACK_USER_IDS
        sync: false
      - key: JIRA_POLL_INTERVAL_SEC
        value: "60"
      - key: CURRENT_RELEASE_VERSION
        sync: false
      - key: JIRA_MAX_PROMPTS_PER_RUN
        value: "10"
      - key: JIRA_MAX_PROMPTS_PER_DAY
        value: "50"
      - key: RISK_NOTIFICATION_MAX_AGE_DAYS
        value: "8"
      - key: RISK_NOTIFICATION_MATCH
        value: "progress red"
